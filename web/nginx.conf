server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # App link verification documents come from the API configuration.
  location ~ ^/\.well-known/(apple-app-site-association|assetlinks\.json)$ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = / { return 302 /discover; }
  location = /discover { try_files /discover/index.html =404; }
  location ~ ^/(?:e/[^/]+|public/events/[^/]+)$ { try_files /app.html =404; }
  location ~ ^/(?:login|signup|auth|verify-email|recover|recover-password|consent/(?:confirm|withdraw)|participant|tickets/[^/]+|door(?:/[^/]+)?|invite/[^/]+|events/[^/]+(?:/(?:access-info|public-archive))?|workspace(?:/[^/]+(?:/.*)?)?)$ {
    try_files /private.html =404;
  }
  location = /private.html { internal; add_header X-Robots-Tag "noindex, nofollow" always; }
  location = /app.html { internal; }
  location / {
    try_files $uri $uri/ =404;
  }
}
