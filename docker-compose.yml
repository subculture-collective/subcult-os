name: ${COMPOSE_PROJECT_NAME:-subcult-os}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - target: 5432
        published: "${POSTGRES_PORT:-35432}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment: &api_environment
      APP_ENV: ${APP_ENV:-development}
      MAIL_DELIVERY_ENABLED: ${MAIL_DELIVERY_ENABLED:-false}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-resend}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_WEBHOOK_TOKEN: ${BREVO_WEBHOOK_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      API_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      IDENTITY_PROTECTION_KEY: ${IDENTITY_PROTECTION_KEY:-}
      IDENTITY_PROTECTION_KEY_PREVIOUS: ${IDENTITY_PROTECTION_KEY_PREVIOUS:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      ATPROTO_OAUTH_ENABLED: ${ATPROTO_OAUTH_ENABLED:-false}
      ATPROTO_OAUTH_CLIENT_ID: ${ATPROTO_OAUTH_CLIENT_ID:-}
      ATPROTO_OAUTH_CALLBACK_URL: ${ATPROTO_OAUTH_CALLBACK_URL:-}
      ATPROTO_OAUTH_JWKS_URL: ${ATPROTO_OAUTH_JWKS_URL:-}
      ATPROTO_OAUTH_CLIENT_PRIVATE_KEY: ${ATPROTO_OAUTH_CLIENT_PRIVATE_KEY:-}
      ATPROTO_OAUTH_CLIENT_KEY_ID: ${ATPROTO_OAUTH_CLIENT_KEY_ID:-subcults-1}
      ATPROTO_OAUTH_CLIENT_PRIVATE_KEY_PREVIOUS: ${ATPROTO_OAUTH_CLIENT_PRIVATE_KEY_PREVIOUS:-}
      ATPROTO_OAUTH_CLIENT_KEY_ID_PREVIOUS: ${ATPROTO_OAUTH_CLIENT_KEY_ID_PREVIOUS:-}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      AT_PROJECTION_ENABLED: ${AT_PROJECTION_ENABLED:-false}
      AT_PROJECTION_SOURCE_URL: ${AT_PROJECTION_SOURCE_URL:-}
      EXTERNAL_TICKET_ALLOWED_HOSTS: ${EXTERNAL_TICKET_ALLOWED_HOSTS:-}
      ANNOUNCEMENT_UNIT_COST_CENTS: ${ANNOUNCEMENT_UNIT_COST_CENTS:-0}
      MOBILE_APPLE_APP_IDS: ${MOBILE_APPLE_APP_IDS:-}
      MOBILE_ANDROID_PACKAGE: ${MOBILE_ANDROID_PACKAGE:-}
      MOBILE_ANDROID_CERT_SHA256: ${MOBILE_ANDROID_CERT_SHA256:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - target: 8080
        published: "${API_PORT:-38080}"

  atproto-revocations:
    profiles: [atproto-workers]
    build: ./backend
    command: ["/app/atproto-revoke", "-watch"]
    environment: *api_environment
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  email-deliveries:
    profiles: [mail-workers]
    build: ./backend
    command: ["/app/email-deliver", "-send", "-watch"]
    environment: *api_environment
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  announcement-dispatch:
    profiles: [announcement-workers]
    build: ./backend
    command: ["/app/email-deliver", "-announce", "-watch"]
    environment: *api_environment
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  atproto-projection:
    profiles: [atproto-projection]
    build: ./backend
    command: ["/app/atproto-project", "-run"]
    environment: *api_environment
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
    ports:
      - target: 80
        published: "${WEB_PORT:-38079}"

volumes:
  postgres-data:
